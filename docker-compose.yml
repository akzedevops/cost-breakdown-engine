version: '3.9'

services:
  backend:
    build: ./backend
    container_name: cbe-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cbe-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
