services:
  backend:
    build: ./backend
    container_name: cbe-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cbe-frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        # Healthcheck is defined in the backend Dockerfile
        condition: service_healthy
    restart: unless-stopped
