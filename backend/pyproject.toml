[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear,
# UP modern syntax, S flake8-bandit (static security checks)
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# asserts are the point of tests; S101 only flags them in production code
"tests/*" = ["S101"]
